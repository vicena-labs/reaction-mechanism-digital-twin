[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="reaction-mechanism-analysis-starter"
version="0.2.0"
requires-python=">=3.10"
dependencies=["numpy","pandas","matplotlib","jsonschema"]
[project.optional-dependencies]
chem=["rdkit","py3Dmol"]
dev=["pytest","pypdf"]
[tool.setuptools.packages.find]
where=["src"]
